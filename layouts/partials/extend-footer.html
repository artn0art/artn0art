{{ if hugo.IsServer }}
{{/* Mode Dev local : Cible (🎯) et Canal (💬) actifs uniquement sur serveur local hugo :1313 */}}
<script src="http://127.0.0.1:8888/_shared/mode-dev/mode-dev.js?v=cn9"></script>
<script>
  (function () {
    function monter() {
      if (!window.ModeDev) return;
      ModeDev.init({
        app: 'canal',
        api: 'http://127.0.0.1:8888'
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', monter);
    } else {
      monter();
    }
  })();
</script>
{{ end }}
